packages:
  - 'apps/*'
  - 'packages/*'

# Отключаем проверку «возраста» пакетов для этого доверенного проекта:
# pnpm 11 по умолчанию блокирует пакеты моложе суток (защита цепочки поставок),
# из-за чего свежие официальные релизы Svelte ломали установку. minimumReleaseAge: 0
# снимает блок только для этого репозитория. (Глобально отключать не стоит.)
minimumReleaseAge: 0
