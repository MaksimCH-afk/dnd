# Hosted-развёртывание (ТЗ v1.2): app-сервер (+ встроенный веб-клиент) + Postgres/pgvector
# + Caddy (TLS/HTTPS) для доступа по домену.
# Запуск:  cp apps/server/.env.example .env  (вписать OPENROUTER_API_KEY, CADDY_DOMAIN)
#          docker compose up -d --build
# После старта игра доступна по https://<домен>/ (Caddy сам берёт сертификат Let's Encrypt).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpg}
      POSTGRES_DB: rpg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rpg']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rpg:${POSTGRES_PASSWORD:-rpg}@db:5432/rpg
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_KEY_NARRATOR: ${OPENROUTER_KEY_NARRATOR:-}
      OPENROUTER_KEY_VALIDATOR: ${OPENROUTER_KEY_VALIDATOR:-}
      OPENROUTER_KEY_DIRECTOR: ${OPENROUTER_KEY_DIRECTOR:-}
      OPENROUTER_KEY_FALLBACK: ${OPENROUTER_KEY_FALLBACK:-}
      OPENROUTER_KEY_NPC: ${OPENROUTER_KEY_NPC:-}
      OPENROUTER_MODEL_NARRATOR: ${OPENROUTER_MODEL_NARRATOR:-}
      OPENROUTER_MODEL_VALIDATOR: ${OPENROUTER_MODEL_VALIDATOR:-}
      OPENROUTER_MODEL_DIRECTOR: ${OPENROUTER_MODEL_DIRECTOR:-}
      OPENROUTER_MODEL_FALLBACK: ${OPENROUTER_MODEL_FALLBACK:-}
      OPENROUTER_MODEL_NPC: ${OPENROUTER_MODEL_NPC:-}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-Xenova/bge-m3}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: 8787
    # Прямой порт (локально/Tailscale/диагностика). Для публичного доступа — через Caddy ниже.
    ports:
      - '8787:8787'

  # Reverse-proxy + автоматический HTTPS для домена.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-dnd.korolevskie-rozy.ru}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
